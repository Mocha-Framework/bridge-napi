name: Build & Publish Bridge NAPI

# Builds the .node binary on Linux/macOS/Windows in CI and publishes
# the multi-platform packages to npm under the @mocha-framework scope.
# Local devs install @mocha-framework/bridge-napi and get the prebuilt
# .node for their platform — they never need to compile locally.

on:
  push:
    branches: [main]
    paths:
      - '**.cpp'
      - '**.h'
      - '**.rs'
      - '**/Cargo.toml'
      - '**/build.rs'
      - 'package.json'
  pull_request:

jobs:
  build:
    name: Build - ${{ matrix.target }} - ${{ matrix.host }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary: mocha-native.linux-x64-gnu.node
            napi_target: x86_64-unknown-linux-gnu
          - host: macos-latest
            target: x86_64-apple-darwin
            binary: mocha-native.darwin-x64.node
            napi_target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
            binary: mocha-native.darwin-arm64.node
            napi_target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
            binary: mocha-native.win32-x64-msvc.node
            napi_target: x86_64-pc-windows-msvc

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Install Qt 6 (Linux/macOS only)
        if: runner.os != 'Windows'
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.0'
          cache: true

      - name: Build Native Addon
        working-directory: ./
        run: napi build --platform ${{ matrix.napi_target }} --release

      - name: Upload Native Binary
        uses: actions/upload-artifact@v4
        with:
          name: bridge-napi-${{ matrix.target }}
          path: ${{ matrix.binary }}
          if-no-files-found: error

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Monorepo Dependencies
        run: npm install

      - name: Download All Native Binaries
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Move Binaries to npm/ Subdirectories
        run: |
          mkdir -p npm/x86_64-unknown-linux-gnu
          mkdir -p npm/x86_64-apple-darwin
          mkdir -p npm/aarch64-apple-darwin
          mkdir -p npm/x86_64-pc-windows-msvc
          mv artifacts/bridge-napi-x86_64-unknown-linux-gnu/mocha-native.linux-x64-gnu.node npm/x86_64-unknown-linux-gnu/mocha-native.linux-x64-gnu.node || true
          mv artifacts/bridge-napi-x86_64-apple-darwin/mocha-native.darwin-x64.node npm/x86_64-apple-darwin/mocha-native.darwin-x64.node || true
          mv artifacts/bridge-napi-aarch64-apple-darwin/mocha-native.darwin-arm64.node npm/aarch64-apple-darwin/mocha-native.darwin-arm64.node || true
          mv artifacts/bridge-napi-x86_64-pc-windows-msvc/mocha-native.win32-x64-msvc.node npm/x86_64-pc-windows-msvc/mocha-native.win32-x64-msvc.node || true
          ls -la npm/

      - name: Generate NAPI Sub-packages
        run: npx napi universal

      - name: Publish to npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish --tag alpha --access public --ignore-scripts
          npx napi publish --tag alpha --access public --ignore-scripts || true
